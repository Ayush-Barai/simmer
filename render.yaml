services:
  - type: web
    name: simmer
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: GEMMA_API_KEY
        sync: false
      - key: GEMMA_MODEL
        value: gemma-4-26b-a4b-it
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: simmer
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_VOICE_ID
        value: EXAVITQu4vr4xnSDxMaL
      - key: ELEVENLABS_AGENT_ID
        sync: false
      - key: ELEVENLABS_STT_MODEL
        value: scribe_v1
      - key: CLERK_PUBLISHABLE_KEY
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: YT_SUB_LANGS
        value: en.*,en
      - key: SENTRY_DSN
        sync: false
